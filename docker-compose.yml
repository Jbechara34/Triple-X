version: "3.8"

# Monero node + P2Pool + web dashboard, all built from source.
#
#   monerod  - Monero full node (Step 1 in the original spec)
#   p2pool   - P2Pool node, mode/wallet controlled from the dashboard's
#              Settings tab (Step 2 in the original spec)
#   app      - the dashboard itself (backend API + web UI)
#
# See README.md for first-run instructions, port forwarding, and how to swap
# monerod's Dockerfile for the prebuilt-binary variant if you don't want to
# wait for a from-source build.

services:
  monerod:
    build:
      context: ./docker/monerod
      dockerfile: Dockerfile
    container_name: triple-x_monerod
    restart: unless-stopped
    command:
      - "--zmq-pub=tcp://0.0.0.0:18083"
      - "--out-peers=32"
      - "--in-peers=64"
      - "--add-priority-node=p2pmd.xmrvsbeast.com:18080"
      - "--add-priority-node=nodes.hashvault.pro:18080"
      - "--enforce-dns-checkpointing"
      - "--enable-dns-blocklist"
      - "--prune-blockchain"
      - "--p2p-bind-ip=0.0.0.0"
      - "--p2p-bind-port=18080"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=18081"
      - "--confirm-external-bind"
      - "--non-interactive"
      - "--log-file=/var/log/monerod/monerod.log"
    ports:
      - "18080:18080" # Monero p2p - forward this on your router for better connectivity
    expose:
      - "18081" # RPC - internal only, do not expose to the internet
      - "18083" # ZMQ - internal only
    volumes:
      - monerod-data:/home/monero/.bitmonero
      - monerod-logs:/var/log/monerod
    networks:
      - internal

  # EXPERIMENTAL - Wallet tab's "generate-once, show-once" Monero wallet
  # creation (see app/lib/moneroWalletRpc.js). Runs in --wallet-dir mode so
  # the app container creates/opens the "dashboard" wallet by name over RPC
  # rather than needing one baked in at build/start time. No --rpc-login:
  # this port is never published to the host (see `expose` below, not
  # `ports`), same internal-network-only trust boundary monerod's own RPC
  # already relies on.
  monero-wallet-rpc:
    build:
      context: ./docker/monerod
      dockerfile: Dockerfile
      target: wallet-rpc
    container_name: triple-x_monero-wallet-rpc
    restart: unless-stopped
    depends_on:
      - monerod
    command:
      - "--wallet-dir=/home/monero/wallet-data"
      - "--daemon-address=monerod:18081"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=18084"
      - "--confirm-external-bind"
      - "--disable-rpc-login"
      - "--non-interactive"
      - "--log-file=/var/log/monero-wallet-rpc/wallet-rpc.log"
    expose:
      - "18084" # RPC - internal only
    volumes:
      - monero-wallet-data:/home/monero/wallet-data
    networks:
      - internal

  p2pool:
    build:
      context: ./docker/p2pool
      dockerfile: Dockerfile
    container_name: triple-x_p2pool
    restart: unless-stopped
    depends_on:
      - monerod
    environment:
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: "18081"
      MONEROD_ZMQ_PORT: "18083"
      CONFIG_FILE: /data/config/settings.json
      DATA_API_DIR: /data/p2pool-api
      LOG_DIR: /data/p2pool-logs
      # Optional Tari (XTM) merge-mining - see entrypoint.sh. Left blank,
      # p2pool behaves exactly as before (XMR only).
      MINOTARI_NODE_HOST: minotari-node
      MINOTARI_NODE_GRPC_PORT: "18142"
      # Extra p2pool flags, space-separated, appended as-is. Example:
      # P2POOL_EXTRA_ARGS: "--out-peers 10 --in-peers 10"
      P2POOL_EXTRA_ARGS: ""
      # Named pipe p2pool's stdin console reads from - lets the app's Logs
      # tab send commands like "status" (see entrypoint.sh + lib/p2poolCommand.js).
      COMMAND_FIFO: /data/config/p2pool-command
    ports:
      - "3333:3333"   # stratum - point your miner here
      - "37889:37889" # P2Pool p2p (standard)
      - "37888:37888" # P2Pool p2p (mini)
      - "37890:37890" # P2Pool p2p (nano)
    volumes:
      - p2pool-data:/home/p2pool/.p2pool
      - shared-config:/data/config
      - p2pool-api:/data/p2pool-api
      - p2pool-logs:/data/p2pool-logs
    networks:
      - internal

  # Tari (XTM) merge-mining - EXPERIMENTAL, disabled by default (P2Pool only
  # merge-mines when a Tari wallet address is set in Settings). Uses Tari's
  # own official images rather than building from source - Tari is a much
  # larger, faster-moving Rust codebase and building it ourselves would be
  # both slower and considerably riskier than monerod/p2pool already were.
  # See docker/minotari/README.md for how these settings were sourced.
  minotari-node:
    image: ghcr.io/tari-project/minotari_node:latest-mainnet
    container_name: triple-x_minotari-node
    restart: unless-stopped
    # The official image's default user is non-root ("tari" - confirmed via
    # its published manifest config), but we don't control its Dockerfile to
    # fix this the way docker/minotari-wallet/Dockerfile does (USER root).
    # A freshly created bind/named volume is owned by root, so "tari" can't
    # write into /tari-data or its log dir - base_node.log never gets
    # created and the app's Logs tab just shows "waiting for the process to
    # start" forever. Run as root to sidestep that; same simplicity-over-
    # defense-in-depth tradeoff already made for minotari-wallet.
    user: "0:0"
    # No --base-path here - the image's own start_tari_app.sh wrapper
    # already hardcodes "--base-path /var/tari/node" ahead of whatever we
    # pass in `command`, and minotari_node rejects a duplicate --base-path
    # outright ("cannot be used multiple times"), crash-looping instantly
    # every time (confirmed directly in the container's own startup log:
    # "base folder (in container): /var/tari/node" printed before our args
    # are even applied). Our volumes below target that fixed path instead.
    command:
      - "--network=mainnet"
      - "--non-interactive"
      - "--init"
      - "-p"
      - "base_node.grpc_enabled=true"
      - "-p"
      - "base_node.grpc_address=/ip4/0.0.0.0/tcp/18142"
      - "-p"
      - "base_node.p2p.transport.type=tcp"
      - "-p"
      - "base_node.p2p.transport.tcp.listener_address=/ip4/0.0.0.0/tcp/18189"
      - "-p"
      # get_sync_progress added this release - lib/minotariRpc.js (the
      # Overview tab's Minotari sync ring) calls it, and any gRPC method not
      # in this allow-list gets rejected by the node.
      - "base_node.grpc_server_allow_methods=get_version, get_tip_info, get_sync_progress, identify, get_network_state, list_headers, get_tokens_in_circulation, get_network_difficulty, get_new_block_template, get_new_block, get_new_block_with_coinbases, get_new_block_template_with_coinbases, get_new_block_blob, submit_block, submit_block_blob, submit_transaction, search_kernels, search_utxos, fetch_matching_utxos, transaction_state, list_connected_peers, get_mempool_stats"
    ports:
      - "18189:18189" # Tari p2p - forward this on your router for better connectivity
    expose:
      - "18142" # gRPC - internal only (read by p2pool's --merge-mine and this app)
    volumes:
      - minotari-node-data:/var/tari/node
      - minotari-node-logs:/var/tari/node/mainnet/log
    networks:
      - internal

  minotari-wallet:
    build:
      context: ./docker/minotari-wallet
      dockerfile: Dockerfile
    container_name: triple-x_minotari-wallet
    restart: unless-stopped
    depends_on:
      - minotari-node
    command:
      - "--base-path=/tari-data"
      - "--network=mainnet"
      - "--non-interactive"
      - "--grpc-enabled"
      - "--grpc-address=/ip4/0.0.0.0/tcp/18143"
      # Only written once, on first-ever wallet creation (a restart with an
      # existing wallet DB does not rewrite it) - the app container reads
      # this file exactly once via the Wallet tab's "Reveal Seed Phrase" and
      # deletes it immediately after, so the seed is never shown twice and
      # never sits on disk beyond that first reveal. See lib/tariWallet.js.
      - "--seed-words-file-name=/tari-data/seed-words.txt"
    expose:
      - "18143" # gRPC - internal only
    volumes:
      - minotari-wallet-data:/tari-data
    networks:
      - internal

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: triple-x_app
    restart: unless-stopped
    depends_on:
      - monerod
      - p2pool
    environment:
      PORT: "3000"
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: "18081"
      CONFIG_DIR: /data/config
      P2POOL_DATA_API_DIR: /data/p2pool-api
      P2POOL_LOG_FILE: /data/p2pool-logs/p2pool.log
      STATE_DIR: /data/state
      P2POOL_STRATUM_PORT: "3333"
      EXPLORER_BASE_URL: "https://xmrchain.net"
      MONEROD_LOG_FILE: /data/monerod-logs/monerod.log
      # Not a flat "base_node.log" - the official minotari_node image's own
      # log4rs config splits output by category into subfiles under a
      # base_node/ subdirectory; base_layer.log is the one that actually
      # gets the general startup/sync/mempool activity this app parses
      # (grpc.log/messages.log/network.log/other.log stay empty in
      # practice). Confirmed directly against a running container - the
      # old flat path never existed, so both the Logs tab and XTM
      # block-found detection (lib/tariBlocks.js) silently never had real
      # data to read.
      MINOTARI_LOG_FILE: /data/minotari-logs/base_node/base_layer.log
      MINOTARI_WALLET_HOST: minotari-wallet
      MINOTARI_WALLET_GRPC_PORT: "18143"
      MINOTARI_WALLET_SEED_FILE: /data/minotari-wallet/seed-words.txt
      MONERO_WALLET_RPC_HOST: monero-wallet-rpc
      MONERO_WALLET_RPC_PORT: "18084"
      MONERO_WALLET_STATE_FILE: /data/state/monero-wallet.json
      # Same shared-config path p2pool's entrypoint.sh creates the FIFO at -
      # see lib/p2poolCommand.js.
      COMMAND_FIFO: /data/config/p2pool-command
    ports:
      - "3000:3000" # the dashboard itself - this is the app's main UI port
    volumes:
      - shared-config:/data/config
      - p2pool-api:/data/p2pool-api:ro
      - p2pool-logs:/data/p2pool-logs:ro
      - monerod-logs:/data/monerod-logs:ro
      - minotari-node-logs:/data/minotari-logs:ro
      # Read-write (not :ro) - the Wallet tab's one-time seed reveal deletes
      # seed-words.txt from this volume right after showing it once.
      - minotari-wallet-data:/data/minotari-wallet
      - app-state:/data/state
      # Settings tab's (hidden, opt-in) "Import Blockchain" feature - see
      # lib/dockerControl.js and lib/blockchainImport.js. Needs to stop/start
      # monerod around the copy (writing into a live LMDB environment risks
      # corrupting it) and write the imported data straight into the same
      # volume monerod itself reads from.
      # SECURITY NOTE: mounting the Docker socket gives this container the
      # same control over the host as root. Off by default
      # (importBlockchainEnabled setting) for exactly this reason - only
      # keep this mount if you intend to use that feature.
      - /var/run/docker.sock:/var/run/docker.sock
      - monerod-data:/data/monerod-import-target
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  monerod-data:
  monerod-logs:
  p2pool-data:
  p2pool-api:
  p2pool-logs:
  shared-config:
  app-state:
  minotari-node-data:
  minotari-node-logs:
  minotari-wallet-data:
  monero-wallet-data:

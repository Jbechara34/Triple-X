syntax = "proto3";

// Minimal subset of tari-project/tari's applications/minotari_app_grpc/proto/base_node.proto
// (service BaseNode, package tari.rpc) - only the one RPC this dashboard needs
// (sync progress for the sidebar bar). Field numbers and names are copied
// verbatim from the upstream proto so this decodes correctly against a real
// minotari_node; unrelated RPCs/messages are omitted on purpose.
package tari.rpc;

service BaseNode {
  rpc GetSyncProgress(Empty) returns (SyncProgressResponse);
  rpc GetNetworkState(GetNetworkStateRequest) returns (GetNetworkStateResponse);
}

message Empty {}

message GetNetworkStateRequest {}

// Minimal subset - the real response has several more fields (metadata,
// hash rate estimates, etc.) we don't need. Field number for num_connections
// (8) copied verbatim from upstream; proto3 safely skips the fields we don't
// declare instead of erroring.
message GetNetworkStateResponse {
  uint64 num_connections = 8;
}

message SyncProgressResponse {
  uint64 tip_height = 1;
  uint64 local_height = 2;
  SyncState state = 3;
  string short_desc = 4;
  uint64 initial_connected_peers = 5;
}

enum SyncState {
  STARTUP = 0;
  HEADER_STARTING = 1;
  HEADER = 2;
  BLOCK_STARTING = 3;
  BLOCK = 4;
  DONE = 5;
}

# Umbrel (and 5tratumOS, which runs the same app framework - see README.md)
# community app store manifest. `id` prefixes every app folder in this repo;
# `name` is what shows up in the App Stores UI when someone adds this repo.
#
# The app folder name and the `id` inside its umbrel-app.yml must be
# `<this id>-triple-x` (see TripleX-triple-x/umbrel-app.yml).
id: TripleX
name: TripleX

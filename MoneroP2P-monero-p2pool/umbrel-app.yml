manifestVersion: 1
# Must be "<your store id from umbrel-app-store.yml>-monero-p2pool" - this
# folder name must match it exactly.
id: MoneroP2P-monero-p2pool
category: bitcoin # umbrel's App Store schema doesn't have a "monero" category as of writing - change if one exists on your umbrelOS/5tratumOS version
name: Monero Node + P2Pool
version: "Dev8"
tagline: Run a Monero node and mine P2Pool with a Monero-GUI-styled dashboard
description: >-
  Runs a full Monero node (monerod) and a P2Pool node side by side, with a
  web dashboard for status, pool stats, blocks found, and settings.
  Choose P2Pool Standard, Mini, or Nano from the Settings tab, point any
  RandomX miner (e.g. XMRig) at the stratum port shown on the Pool tab, and
  payouts go straight to your own wallet address - no third-party pool,
  no custodian, 0% fee.
developer: Jbechara34
website: https://github.com/Jbechara34/monero-p2pool-dashboard
dependencies: []
repo: https://github.com/Jbechara34/monero-p2pool-dashboard
support: https://github.com/Jbechara34/monero-p2pool-dashboard/issues
port: 3000
# Add real screenshots here before publishing - these are placeholders.
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Jbechara34
submission: https://github.com/Jbechara34/monero-p2pool-dashboard
releaseNotes: >-
  Dev8 (development build): fixes monerod crash-looping with "Permission
  denied: /root/.bitmonero" even after dropping to the unprivileged monero
  user. Root cause: setpriv changes the process's UID/GID but does not
  reset HOME, so monerod still saw HOME=/root (inherited from the
  container's root shell) and tried to use /root/.bitmonero as its default
  data dir - confirmed via a live container's logs. Now explicitly sets
  HOME before dropping privileges (fixed in both monerod's and p2pool's
  entrypoint.sh). Includes Dev7's monerod portable-build fix, Dev6's
  P2Pool shared-library fix, Dev5's monerod shared-library fix, Dev4's
  live sidebar sync status, Dev3's live-tail Logs tab, Dev2's P2Pool
  startup fix, and Dev1's Logs tab + UI redesign.

version: "3.7"

# This is the Umbrel/5tratumOS-flavored compose file - it follows the
# platform's conventions (app_proxy, ${APP_DATA_DIR} bind mounts, prebuilt
# images instead of `build:`) rather than the plain-Docker one at the repo
# root. See ../README.md "Umbrel / 5tratumOS community app store install"
# for the full picture, including how images get built and published.
#
# BEFORE PUBLISHING: replace `your-github-username` below with wherever you
# actually push the three images (see ../.github/workflows/publish-images.yml),
# and pin each `image:` to a `@sha256:<digest>` once you have one - Umbrel's
# own apps all do this so an update can't silently change what's running.

services:
  app_proxy:
    environment:
      # "<app-id>_<service-name>_1" - the trailing "_1" is required by
      # Umbrel's proxy convention, even though this app only ever runs one
      # replica of each service.
      APP_HOST: MoneroP2P-monero-p2pool_web_1
      APP_PORT: 3000

  web:
    # Pinned to the Dev5 build's exact digest (not :latest) so the platform
    # is forced to pull this specific image instead of reusing whatever it
    # already has cached under a floating tag. Update this digest (see
    # ../.github/workflows/publish-images.yml) every time a new version is
    # published.
    image: ghcr.io/jbechara34/monero-p2pool-dashboard-app@sha256:a8034f5ef1aedae7f454a2c3569458772ccdb8b38d793df732e068f23150b97f
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/config:/data/config
      - ${APP_DATA_DIR}/p2pool-api:/data/p2pool-api:ro
      - ${APP_DATA_DIR}/p2pool-logs:/data/p2pool-logs:ro
      - ${APP_DATA_DIR}/monerod-logs:/data/monerod-logs:ro
      - ${APP_DATA_DIR}/minotari-logs:/data/minotari-logs:ro
      - ${APP_DATA_DIR}/state:/data/state
    environment:
      PORT: "3000"
      # Plain service name - Compose gives every service in this project a DNS
      # alias equal to its name on the project's own network, regardless of
      # how the platform names/cases the project itself. Only app_proxy (a
      # separate container on 5tratumOS's shared network, outside this
      # project) needs the fully-qualified "<app-id>_<service>_1" form above.
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: "18081"
      CONFIG_DIR: /data/config
      P2POOL_DATA_API_DIR: /data/p2pool-api
      P2POOL_LOG_FILE: /data/p2pool-logs/p2pool.log
      STATE_DIR: /data/state
      P2POOL_STRATUM_PORT: "3333"
      EXPLORER_BASE_URL: "https://xmrchain.net"
      MONEROD_LOG_FILE: /data/monerod-logs/monerod.log
      MINOTARI_LOG_FILE: /data/minotari-logs/base_node.log

  monerod:
    # Pinned to the Dev5 build's exact digest - see note on web's image above.
    image: ghcr.io/jbechara34/monero-p2pool-dashboard-monerod@sha256:6198db595cf9c40e2b5bd0ddae39480c2d482f665f09bb1232c0dbb33967dd8c
    restart: on-failure
    stop_grace_period: 1m
    command:
      - "--zmq-pub=tcp://0.0.0.0:18083"
      - "--out-peers=32"
      - "--in-peers=64"
      - "--add-priority-node=p2pmd.xmrvsbeast.com:18080"
      - "--add-priority-node=nodes.hashvault.pro:18080"
      - "--enforce-dns-checkpointing"
      - "--enable-dns-blocklist"
      - "--prune-blockchain"
      - "--p2p-bind-ip=0.0.0.0"
      - "--p2p-bind-port=18080"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=18081"
      - "--confirm-external-bind"
      - "--non-interactive"
      - "--log-file=/var/log/monerod/monerod.log"
    ports:
      - "18080:18080" # Monero p2p - forward this on your router for better connectivity
    volumes:
      - ${APP_DATA_DIR}/monerod:/home/monero/.bitmonero
      - ${APP_DATA_DIR}/monerod-logs:/var/log/monerod

  p2pool:
    # Pinned to the Dev5 build's exact digest - see note on web's image above.
    image: ghcr.io/jbechara34/monero-p2pool-dashboard-p2pool@sha256:85f015db4218e0951c38872d7da5963fdd7cc10010aae16b5a396964bd126315
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: "18081"
      MONEROD_ZMQ_PORT: "18083"
      CONFIG_FILE: /data/config/settings.json
      DATA_API_DIR: /data/p2pool-api
      LOG_DIR: /data/p2pool-logs
      # Optional Tari (XTM) merge-mining - see entrypoint.sh. Left blank,
      # p2pool behaves exactly as before (XMR only).
      MINOTARI_NODE_HOST: minotari-node
      MINOTARI_NODE_GRPC_PORT: "18142"
    ports:
      - "3333:3333"   # stratum - point your miner here
      - "37889:37889" # P2Pool p2p (standard)
      - "37888:37888" # P2Pool p2p (mini)
      - "37890:37890" # P2Pool p2p (nano)
    volumes:
      - ${APP_DATA_DIR}/p2pool:/home/p2pool/.p2pool
      - ${APP_DATA_DIR}/config:/data/config
      - ${APP_DATA_DIR}/p2pool-api:/data/p2pool-api
      - ${APP_DATA_DIR}/p2pool-logs:/data/p2pool-logs

  # Tari (XTM) merge-mining - EXPERIMENTAL, disabled by default (P2Pool only
  # merge-mines when a Tari wallet address is set in Settings). Uses Tari's
  # own official images rather than building from source - see
  # ../docker/minotari-wallet/Dockerfile for why.
  minotari-node:
    image: ghcr.io/tari-project/minotari_node:latest-mainnet
    restart: on-failure
    stop_grace_period: 1m
    command:
      - "--base-path=/tari-data"
      - "--network=mainnet"
      - "--non-interactive"
      - "--init"
      - "-p"
      - "base_node.grpc_enabled=true"
      - "-p"
      - "base_node.grpc_address=/ip4/0.0.0.0/tcp/18142"
      - "-p"
      - "base_node.p2p.transport.type=tcp"
      - "-p"
      - "base_node.p2p.transport.tcp.listener_address=/ip4/0.0.0.0/tcp/18189"
      - "-p"
      - "base_node.grpc_server_allow_methods=get_version, get_tip_info, identify, get_network_state, list_headers, get_tokens_in_circulation, get_network_difficulty, get_new_block_template, get_new_block, get_new_block_with_coinbases, get_new_block_template_with_coinbases, get_new_block_blob, submit_block, submit_block_blob, submit_transaction, search_kernels, search_utxos, fetch_matching_utxos, transaction_state, list_connected_peers, get_mempool_stats"
    ports:
      - "18189:18189" # Tari p2p - forward this on your router for better connectivity
    volumes:
      - ${APP_DATA_DIR}/minotari-node:/tari-data
      - ${APP_DATA_DIR}/minotari-logs:/tari-data/mainnet/log

  minotari-wallet:
    # Pinned once published - see note on web's image above.
    image: ghcr.io/jbechara34/monero-p2pool-dashboard-minotari-wallet:latest
    restart: on-failure
    stop_grace_period: 1m
    command:
      - "--base-path=/tari-data"
      - "--network=mainnet"
      - "--non-interactive"
      - "--grpc-enabled"
      - "--grpc-address=/ip4/0.0.0.0/tcp/18143"
    volumes:
      - ${APP_DATA_DIR}/minotari-wallet:/tari-data

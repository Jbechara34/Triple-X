version: "3.7"

# This is the Umbrel/5tratumOS-flavored compose file - it follows the
# platform's conventions (app_proxy, ${APP_DATA_DIR} bind mounts, prebuilt
# images instead of `build:`) rather than the plain-Docker one at the repo
# root. See ../README.md "Umbrel / 5tratumOS community app store install"
# for the full picture, including how images get built and published.
#
# Every `image:` below should be pinned to a `@sha256:<digest>` once
# published (see ../.github/workflows/publish-images.yml) - Umbrel's own
# apps all do this so an update can't silently change what's running.

services:
  app_proxy:
    environment:
      # "<app-id>_<service-name>_1" - the trailing "_1" is required by
      # Umbrel's proxy convention, even though this app only ever runs one
      # replica of each service.
      APP_HOST: TripleX-triple-x_web_1
      APP_PORT: 3000

  web:
    # Pinned to the v0.0.1-Dev2 build's exact digest (not :latest) so the
    # platform is forced to pull this specific image instead of reusing
    # whatever it already has cached under a floating tag. Update this
    # digest (see ../.github/workflows/publish-images.yml) every time a new
    # version is published.
    image: ghcr.io/jbechara34/triple-x-app@sha256:9798cb22382d54925b5743ff454d0624c0d867f72e06072cc0493380b40d5c6d
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/config:/data/config
      - ${APP_DATA_DIR}/p2pool-api:/data/p2pool-api:ro
      - ${APP_DATA_DIR}/p2pool-logs:/data/p2pool-logs:ro
      - ${APP_DATA_DIR}/monerod-logs:/data/monerod-logs:ro
      - ${APP_DATA_DIR}/minotari-logs:/data/minotari-logs:ro
      - ${APP_DATA_DIR}/state:/data/state
      # Read-write (not :ro) - the Wallet tab's one-time Tari seed reveal
      # deletes seed-words.txt from this volume right after showing it once.
      - ${APP_DATA_DIR}/minotari-wallet:/data/minotari-wallet
    environment:
      PORT: "3000"
      # Plain service name - Compose gives every service in this project a DNS
      # alias equal to its name on the project's own network, regardless of
      # how the platform names/cases the project itself. Only app_proxy (a
      # separate container on 5tratumOS's shared network, outside this
      # project) needs the fully-qualified "<app-id>_<service>_1" form above.
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: "18081"
      CONFIG_DIR: /data/config
      P2POOL_DATA_API_DIR: /data/p2pool-api
      P2POOL_LOG_FILE: /data/p2pool-logs/p2pool.log
      STATE_DIR: /data/state
      P2POOL_STRATUM_PORT: "3333"
      EXPLORER_BASE_URL: "https://xmrchain.net"
      MONEROD_LOG_FILE: /data/monerod-logs/monerod.log
      MINOTARI_LOG_FILE: /data/minotari-logs/base_node.log
      MINOTARI_WALLET_HOST: minotari-wallet
      MINOTARI_WALLET_GRPC_PORT: "18143"
      MINOTARI_WALLET_SEED_FILE: /data/minotari-wallet/seed-words.txt
      MONERO_WALLET_RPC_HOST: monero-wallet-rpc
      MONERO_WALLET_RPC_PORT: "18084"
      MONERO_WALLET_STATE_FILE: /data/state/monero-wallet.json

  monerod:
    # Pinned to the v0.0.1-Dev2 build's exact digest - see note on web's image above.
    image: ghcr.io/jbechara34/triple-x-monerod@sha256:330d99a891fc730de8a7e03afe6f4ee29b6ea29be1049f8dae0c5514dd28f339
    restart: on-failure
    stop_grace_period: 1m
    command:
      - "--zmq-pub=tcp://0.0.0.0:18083"
      - "--out-peers=32"
      - "--in-peers=64"
      - "--add-priority-node=p2pmd.xmrvsbeast.com:18080"
      - "--add-priority-node=nodes.hashvault.pro:18080"
      - "--enforce-dns-checkpointing"
      - "--enable-dns-blocklist"
      - "--prune-blockchain"
      - "--p2p-bind-ip=0.0.0.0"
      - "--p2p-bind-port=18080"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=18081"
      - "--confirm-external-bind"
      - "--non-interactive"
      - "--log-file=/var/log/monerod/monerod.log"
    ports:
      - "18080:18080" # Monero p2p - forward this on your router for better connectivity
    volumes:
      - ${APP_DATA_DIR}/monerod:/home/monero/.bitmonero
      - ${APP_DATA_DIR}/monerod-logs:/var/log/monerod

  # Wallet tab's "generate-once, show-once" Monero wallet creation. Runs in
  # --wallet-dir mode (wallets managed by name over RPC) with
  # --disable-rpc-login - never published to the host (no `ports:` here),
  # same internal-network-only trust boundary monerod's own RPC relies on.
  monero-wallet-rpc:
    # Pinned to the v0.0.1-Dev2 build's exact digest - see note on web's
    # image above. New this release; shares docker/monerod/Dockerfile's
    # builder stage with monerod itself, just a different final target.
    image: ghcr.io/jbechara34/triple-x-monero-wallet-rpc@sha256:b812fc113f9d8cf6009d9602ec3c5f5a3aeef16d59006caa37d5bc7bd737c8ba
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - monerod
    command:
      - "--wallet-dir=/home/monero/wallet-data"
      - "--daemon-address=monerod:18081"
      - "--rpc-bind-ip=0.0.0.0"
      - "--rpc-bind-port=18084"
      - "--confirm-external-bind"
      - "--disable-rpc-login"
      - "--non-interactive"
      - "--log-file=/var/log/monero-wallet-rpc/wallet-rpc.log"
    volumes:
      - ${APP_DATA_DIR}/monero-wallet:/home/monero/wallet-data

  p2pool:
    # Pinned to the v0.0.1-Dev2 build's exact digest - see note on web's image above.
    image: ghcr.io/jbechara34/triple-x-p2pool@sha256:f8f46559710428d13506fdcb3110996b1c106adaf18134b6a8111d193c0d7408
    restart: on-failure
    stop_grace_period: 1m
    environment:
      MONEROD_HOST: monerod
      MONEROD_RPC_PORT: "18081"
      MONEROD_ZMQ_PORT: "18083"
      CONFIG_FILE: /data/config/settings.json
      DATA_API_DIR: /data/p2pool-api
      LOG_DIR: /data/p2pool-logs
      # Optional Tari (XTM) merge-mining - see entrypoint.sh. Left blank,
      # p2pool behaves exactly as before (XMR only).
      MINOTARI_NODE_HOST: minotari-node
      MINOTARI_NODE_GRPC_PORT: "18142"
    ports:
      - "3333:3333"   # stratum - point your miner here
      - "37889:37889" # P2Pool p2p (standard)
      - "37888:37888" # P2Pool p2p (mini)
      - "37890:37890" # P2Pool p2p (nano)
    volumes:
      - ${APP_DATA_DIR}/p2pool:/home/p2pool/.p2pool
      - ${APP_DATA_DIR}/config:/data/config
      - ${APP_DATA_DIR}/p2pool-api:/data/p2pool-api
      - ${APP_DATA_DIR}/p2pool-logs:/data/p2pool-logs

  # Tari (XTM) merge-mining - EXPERIMENTAL, disabled by default (P2Pool only
  # merge-mines when a Tari wallet address is set in Settings). Uses Tari's
  # own official images rather than building from source - see
  # ../docker/minotari-wallet/Dockerfile for why.
  minotari-node:
    image: ghcr.io/tari-project/minotari_node:latest-mainnet
    restart: on-failure
    stop_grace_period: 1m
    command:
      - "--base-path=/tari-data"
      - "--network=mainnet"
      - "--non-interactive"
      - "--init"
      - "-p"
      - "base_node.grpc_enabled=true"
      - "-p"
      - "base_node.grpc_address=/ip4/0.0.0.0/tcp/18142"
      - "-p"
      - "base_node.p2p.transport.type=tcp"
      - "-p"
      - "base_node.p2p.transport.tcp.listener_address=/ip4/0.0.0.0/tcp/18189"
      - "-p"
      # get_sync_progress added this release - lib/minotariRpc.js (the
      # Overview tab's Minotari sync ring) calls it, and any gRPC method not
      # in this allow-list gets rejected by the node.
      - "base_node.grpc_server_allow_methods=get_version, get_tip_info, get_sync_progress, identify, get_network_state, list_headers, get_tokens_in_circulation, get_network_difficulty, get_new_block_template, get_new_block, get_new_block_with_coinbases, get_new_block_template_with_coinbases, get_new_block_blob, submit_block, submit_block_blob, submit_transaction, search_kernels, search_utxos, fetch_matching_utxos, transaction_state, list_connected_peers, get_mempool_stats"
    ports:
      - "18189:18189" # Tari p2p - forward this on your router for better connectivity
    volumes:
      - ${APP_DATA_DIR}/minotari-node:/tari-data
      - ${APP_DATA_DIR}/minotari-logs:/tari-data/mainnet/log

  minotari-wallet:
    # Pinned to the v0.0.1-Dev2 build's exact digest - see note on web's image above.
    image: ghcr.io/jbechara34/triple-x-minotari-wallet@sha256:599455a26dad1878e28850ebfc3c33e21ede96df3264083509df9c395162a971
    restart: on-failure
    stop_grace_period: 1m
    command:
      - "--base-path=/tari-data"
      - "--network=mainnet"
      - "--non-interactive"
      - "--grpc-enabled"
      - "--grpc-address=/ip4/0.0.0.0/tcp/18143"
      # Only written once, on first-ever wallet creation - the app container
      # reads this file exactly once via the Wallet tab's "Reveal Seed
      # Phrase" and deletes it immediately after. See lib/tariWallet.js.
      - "--seed-words-file-name=/tari-data/seed-words.txt"
    volumes:
      - ${APP_DATA_DIR}/minotari-wallet:/tari-data
